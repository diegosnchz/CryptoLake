[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptolake"
version = "0.1.0"
description = "CryptoLake data platform: ingestion, lakehouse, serving and orchestration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.5,<3",
  "pydantic-settings>=2.1,<3",
  "pyhive>=0.7,<1",
  "thrift>=0.16,<0.23",
  "requests>=2.31,<3",
  "structlog>=24,<26",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<0.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]
