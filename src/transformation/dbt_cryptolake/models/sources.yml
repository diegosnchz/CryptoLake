version: 2

sources:
  - name: silver
    description: "Silver layer generated by Spark jobs in this repo"
    schema: silver
    tables:
      - name: ohlcv_1m
        description: "1-minute OHLCV candles derived from bronze.futures_trades"
        columns:
          - name: symbol
          - name: window_start
          - name: window_end
          - name: open
          - name: high
          - name: low
          - name: close
          - name: volume
          - name: trades
          - name: trade_date
          - name: updated_at
